<!DOCTYPE html>
<html>
<head>
<title>IndiaPost Scanner Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial;
  background: #f2f2f2;
  text-align: center;
  padding: 20px;
}

.box {
  background: white;
  padding: 25px;
  border-radius: 12px;
  max-width: 400px;
  margin: auto;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

input, button {
  width: 90%;
  padding: 10px;
  margin: 10px;
}

button {
  background: blue;
  color: white;
  border: none;
  border-radius: 5px;
}
</style>
</head>

<body>

<div class="box">
  <h2>IndiaPost Scanner Pro</h2>

  <p>Enter your details to activate license</p>

  <input id="name" placeholder="Your Name"><br>
  <input id="phone" placeholder="Phone Number"><br>
  <input id="deviceId" placeholder="Device ID"><br>

  <button onclick="submitData()">Activate License</button>

  <p id="result"></p>
</div>

<script>
function submitData() {
  var name = document.getElementById("name").value;
  var phone = document.getElementById("phone").value;
  var deviceId = document.getElementById("deviceId").value;

  fetch("https://script.google.com/macros/s/AKfycbwXtOFK7oXqH8A3QY7lWH4zKSHRyDmN8Cql7YJdwpxDmSzP_LeHVT-krngaHsHeMTjr5w/exec", {
    method: "POST",
    body: JSON.stringify({
      name: name,
      phone: phone,
      deviceId: deviceId,
      plan: "monthly"
    })
  })
  .then(res => res.json())
  .then(data => {
    document.getElementById("result").innerHTML =
  "License Key:<br><b>" + data.licenseKey +
  "</b><br>Expiry Date: " + data.expiryDate;
  });
}
</script>

</body>
</html>
