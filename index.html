<!DOCTYPE html>
<html>
<head>
  <title>IndiaPost Scanner Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
        url("https://ibb.co/Y4fJbTLV") center/cover no-repeat;
    }

    .box {
      background: rgba(255,255,255,0.96);
      padding: 28px;
      border-radius: 18px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0,0,0,0.45);
    }

    h2 { color: #c62828; font-size: 30px; }
    p { color: #333; }

    input {
      width: 100%;
      padding: 13px;
      margin: 9px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      background: #c62828;
      color: white;
      cursor: pointer;
    }

    #result {
      margin-top: 18px;
      color: green;
      font-size: 15px;
      line-height: 1.5;
      word-break: break-word;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>IndiaPost Scanner Pro</h2>
    <p>Monthly License ₹199</p>

    <input id="name" placeholder="Enter Name">
    <input id="phone" placeholder="Phone Number">
    <input id="deviceId" placeholder="Device ID shown in extension">

    <button onclick="payNow()">Pay ₹199 & Generate License</button>

    <div id="result"></div>
  </div>

<script>
function payNow() {
  var name = document.getElementById("name").value.trim();
  var phone = document.getElementById("phone").value.trim();
  var deviceId = document.getElementById("deviceId").value.trim();

  if (!name || !phone || !deviceId) {
    alert("Please fill all details");
    return;
  }

  var options = {
    key: "rzp_test_SlJrZkyK4legTr",
    amount: 19900,
    currency: "INR",
    name: "IndiaPost Scanner Pro",
    description: "Monthly License",

    notes: {
      name: name,
      phone: phone,
      deviceId: deviceId,
      plan: "monthly"
    },

    handler: function(response) {
      document.getElementById("result").innerHTML =
        "Payment successful. Generating license...";

      fetch("https://script.google.com/macros/s/AKfycbwXtOFK7oXqH8A3QY7lWH4zKSHRyDmN8Cql7YJdwpxDmSzP_LeHVT-krngaHsHeMTjr5w/exec", {
        method: "POST",
        body: JSON.stringify({
          source: "checkout",
          name: name,
          phone: phone,
          deviceId: deviceId,
          plan: "monthly",
          paymentId: response.razorpay_payment_id
        })
      })
      .then(res => res.json())
      .then(data => {
  if (data.success) {
    document.getElementById("result").innerHTML =
      "<b>License Key:</b><br>" + data.licenseKey +
      "<br><b>Expiry Date:</b> " + data.expiryDate;
  } else {
    document.getElementById("result").innerHTML =
      "Payment successful, but error:<br>" + data.message;
  }
})
      .catch(() => {
        document.getElementById("result").innerHTML =
          "Payment done. If license is not shown, contact support with payment ID.";
      });
    },

    prefill: {
      name: name,
      contact: phone
    },

    theme: {
      color: "#c62828"
    }
  };

  var rzp = new Razorpay(options);
  rzp.open();
}
</script>
</body>
</html>
